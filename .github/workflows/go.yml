# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.6', 'stable']
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      working-directory: terraform_provider
      run: go build -v ./...

    - name: Test with coverage
      working-directory: terraform_provider
      run: |
        go test -v -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out
        go tool cover -html=coverage.out -o coverage.html
    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      with:
        name: go-coverage-${{ matrix.go-version }}
        path: terraform_provider/coverage.out

    - uses: golangci/golangci-lint-action@v9
      # Lint once on the pinned toolchain: golangci-lint's type-checker cannot parse
      # stdlib from newer Go releases than the one it was built with.
      if: matrix.go-version == '1.25.6'
      with:
        version: v2.12.2
        working-directory: terraform_provider

