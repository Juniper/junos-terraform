name: Go provider and Terraform plan

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-plan:
    name: Terraform integration (${{ matrix.schema_scope }} schema)
    runs-on: ubuntu-latest
    env:
      TF_APPLY_PARALLELISM: 3
    strategy:
      fail-fast: false
      matrix:
        # One provider implementation; these differ only in the schema it embeds.
        schema_scope: [trimmed, full]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python (latest)
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install Python dependencies for tooling
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -m pip install .
        python -m pip install asyncssh

    - name: Run NETCONF mock unit tests
      run: |
        pytest -q netconf_mock/tests/test_netconf_mock_server.py

    - name: Run jtaf-xml2tf unit tests
      run: |
        pytest -q junosterraform/tests/test_xml2tf_flatten.py

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4

    - name: Generate provider with ${{ matrix.schema_scope }} schema using jtaf-yang2go
      run: |
        set -euo pipefail
        rm -rf terraform-provider-junos-vqfx-evpn-vxlan

        provider_args=(
          -p examples/yang/18.2/18.2R3/common
          examples/yang/18.2/18.2R3/junos-qfx/conf/*.yang
        )
        if [[ "${{ matrix.schema_scope }}" == "full" ]]; then
          provider_args+=(--generic)
        else
          provider_args+=(
            -x
            examples/evpn-vxlan-dc/dc1/dc1-borderleaf1.xml
            examples/evpn-vxlan-dc/dc1/dc1-borderleaf2.xml
            examples/evpn-vxlan-dc/dc1/dc1-leaf1.xml
            examples/evpn-vxlan-dc/dc1/dc1-leaf2.xml
            examples/evpn-vxlan-dc/dc1/dc1-leaf3.xml
            examples/evpn-vxlan-dc/dc1/dc1-spine1.xml
            examples/evpn-vxlan-dc/dc1/dc1-spine2.xml
            examples/evpn-vxlan-dc/dc2/dc2-spine1.xml
            examples/evpn-vxlan-dc/dc2/dc2-spine2.xml
          )
        fi
        provider_args+=(-t vqfx-evpn-vxlan)
        jtaf-yang2go "${provider_args[@]}"

    - name: Build and test provider with ${{ matrix.schema_scope }} schema
      working-directory: terraform-provider-junos-vqfx-evpn-vxlan
      run: |
        go build -v ./...
        go test -v ./...

    - name: Generate EVPN-VXLAN Terraform files
      run: |
        jtaf-xml2tf \
          -j terraform-provider-junos-vqfx-evpn-vxlan/trimmed_schema.json.gz \
          -x examples/evpn-vxlan-dc/dc1/*{spine,leaf}*.xml examples/evpn-vxlan-dc/dc2/*spine*.xml \
          -t vqfx-evpn-vxlan \
          -d ci-evpn-vxlan-tf \
          -u ci-user \
          -p ci-password

    - name: Prepare Terraform integration environment
      run: |
        set -euo pipefail

        pushd terraform-provider-junos-vqfx-evpn-vxlan
        go install .
        popd

        mkdir -p "$HOME/go/bin"
        cat > "$HOME/.terraformrc" <<EOF
        provider_installation {
          dev_overrides {
            "hashicorp/junos-vqfx-evpn-vxlan" = "$HOME/go/bin"
          }
          direct {}
        }
        EOF

        echo "TF_CLI_CONFIG_FILE=$HOME/.terraformrc" >> "$GITHUB_ENV"
        echo "TF_IN_AUTOMATION=1" >> "$GITHUB_ENV"

        # Build a deterministic host->port map from generated providers.tf and rewrite providers to use mock sockets.
        python .github/scripts/rewrite_mock_providers.py \
          --providers-file ci-evpn-vxlan-tf/providers.tf \
          --devices-file ci-evpn-vxlan-tf/mock-devices.txt \
          --bind-host 127.0.0.1 \
          --base-port 8301

        nohup python netconf_mock/netconf_mock_server.py \
          --host 127.0.0.1 \
          --username ci-user \
          --password ci-password \
          --log-level DEBUG \
          --devices-file ci-evpn-vxlan-tf/mock-devices.txt \
          --state-dump netconf-mock-state.json \
          > netconf-mock.log 2>&1 < /dev/null &
        echo "$!" > .netconf_mock.pid

        # Wait for all per-device listeners to be ready, or fail early with server logs.
        all_ready=0
        for _ in $(seq 1 30); do
          if ! kill -0 "$(cat .netconf_mock.pid)" 2>/dev/null; then
            echo "NETCONF mock exited during startup"
            cat netconf-mock.log || true
            exit 1
          fi

          all_ready=1
          while IFS=: read -r _dev_name dev_port; do
            if [ -z "${dev_port}" ]; then
              continue
            fi
            if ! (echo > /dev/tcp/127.0.0.1/"${dev_port}") >/dev/null 2>&1; then
              all_ready=0
              break
            fi
          done < ci-evpn-vxlan-tf/mock-devices.txt

          if [ "$all_ready" -eq 1 ]; then
            break
          fi
          sleep 1
        done

        if [ "$all_ready" -ne 1 ]; then
          echo "NETCONF mock listeners were not ready in time"
          cat netconf-mock.log || true
          exit 1
        fi

        echo "NETCONF mock process started with PID $(cat .netconf_mock.pid)"
        echo "Device socket map:"
        cat ci-evpn-vxlan-tf/mock-devices.txt
        echo "Active listener snapshot:"
        if command -v ss >/dev/null 2>&1; then
          ss -ltn | grep -E '127\.0\.0\.1:(830[0-9]|83[1-9][0-9])' || true
        elif command -v netstat >/dev/null 2>&1; then
          netstat -ltn | grep -E '127\.0\.0\.1:(830[0-9]|83[1-9][0-9])' || true
        else
          echo "Neither ss nor netstat is available in this runner"
        fi

    - name: Terraform validate configuration against ${{ matrix.schema_scope }} schema
      working-directory: ci-evpn-vxlan-tf
      run: |
        set -euo pipefail
        # dev_overrides resolve the provider without `terraform init`, so validate
        # loads the built provider's schema the same way plan and apply do. It fails
        # here, before the mock lifecycle, if the schema cannot be built from the
        # embedded model or the generated configuration does not match it.
        terraform validate -no-color

    - name: Preflight NETCONF mock before Terraform apply
      run: |
        set -euo pipefail

        if [ ! -f .netconf_mock.pid ]; then
          echo "Missing .netconf_mock.pid"
          exit 1
        fi

        MOCK_PID="$(cat .netconf_mock.pid)"
        if ! kill -0 "$MOCK_PID" 2>/dev/null; then
          echo "NETCONF mock process is not running (pid=$MOCK_PID)"
          cat netconf-mock.log || true
          exit 1
        fi

        python - <<'PY'
        import pathlib
        import socket
        import sys

        devices = pathlib.Path('ci-evpn-vxlan-tf/mock-devices.txt')
        failures = []

        for line in devices.read_text().splitlines():
          line = line.strip()
          if not line:
            continue
          host, port_text = line.rsplit(':', 1)
          port = int(port_text)
          try:
            with socket.create_connection(('127.0.0.1', port), timeout=1.5):
              pass
          except OSError as exc:
            failures.append(f"{host}:{port} -> {exc}")

        if failures:
          print('One or more NETCONF mock listeners are unreachable:', file=sys.stderr)
          for failure in failures:
            print(f"  - {failure}", file=sys.stderr)
          sys.exit(1)

        print('NETCONF mock preflight passed for all generated listeners')
        PY

    - name: Terraform initial apply
      working-directory: ci-evpn-vxlan-tf
      run: |
        set -euo pipefail
        # With provider dev_overrides, skip `terraform init` to avoid registry lookups for unpublished providers.
        terraform plan -refresh=false -no-color -input=false -out=tfplan-initial
        terraform apply -no-color -input=false -auto-approve -parallelism="$TF_APPLY_PARALLELISM" tfplan-initial

    - name: Terraform no-op plan after initial apply
      id: no_op_plan_initial
      continue-on-error: true
      working-directory: ci-evpn-vxlan-tf
      run: terraform plan -refresh=false -no-color -input=false -detailed-exitcode

    - name: Assert no-op exit code after initial apply
      run: |
        if [ "${{ steps.no_op_plan_initial.outputs.exitcode }}" != "0" ]; then
          echo "Expected no-op plan after apply, got exit code ${{ steps.no_op_plan_initial.outputs.exitcode }}"
          exit 1
        fi

    - name: Mutate interface IP to force replacement
      working-directory: ci-evpn-vxlan-tf
      run: |
        set -euo pipefail
        python ../.github/scripts/mutate_first_ipv4_cidr.py \
          --directory . \
          --replacement 203.0.113.10/32 \
          --exclude providers.tf

    - name: Terraform changed plan after mutation
      id: changed_plan
      continue-on-error: true
      working-directory: ci-evpn-vxlan-tf
      run: terraform plan -refresh=false -no-color -input=false -detailed-exitcode -out=tfplan-updated

    - name: Assert changed plan exit code
      run: |
        if [ "${{ steps.changed_plan.outputs.exitcode }}" != "2" ]; then
          echo "Expected changed plan exit code 2, got ${{ steps.changed_plan.outputs.exitcode }}"
          exit 1
        fi

    - name: Terraform apply changed plan
      working-directory: ci-evpn-vxlan-tf
      run: terraform apply -no-color -input=false -auto-approve -parallelism="$TF_APPLY_PARALLELISM" tfplan-updated

    - name: Terraform final no-op plan
      id: no_op_plan_final
      continue-on-error: true
      working-directory: ci-evpn-vxlan-tf
      run: terraform plan -refresh=false -no-color -input=false -detailed-exitcode

    - name: Assert final no-op exit code
      run: |
        if [ "${{ steps.no_op_plan_final.outputs.exitcode }}" != "0" ]; then
          echo "Expected no-op plan after second apply, got exit code ${{ steps.no_op_plan_final.outputs.exitcode }}"
          exit 1
        fi

    - name: Validate terraform state entries
      working-directory: ci-evpn-vxlan-tf
      run: |
        set -euo pipefail
        test -f terraform.tfstate
        state_count="$(terraform state list | wc -l)"
        if [ "$state_count" -le 0 ]; then
          echo "Expected terraform state entries, got none"
          exit 1
        fi

    - name: Capture baseline state metadata
      id: state_baseline
      working-directory: ci-evpn-vxlan-tf
      run: |
        set -euo pipefail
        before_serial="$(terraform state pull | python ../.github/scripts/tfstate_serial.py)"
        echo "serial=$before_serial" >> "$GITHUB_OUTPUT"
        # Record one managed resource path so we can assert it survives drift/reconcile cycles.
        # Avoid early pipe close (head) which can surface as EPIPE in the GH wrapper.
        first_resource="$(terraform state list | sed -n '1p')"
        echo "resource=$first_resource" >> "$GITHUB_OUTPUT"

        # Use the generated device map as source-of-truth for mock hostnames.
        target_host="$(head -n 1 mock-devices.txt | cut -d: -f1 | tr -d '[:space:]')"

        if [ -z "$target_host" ]; then
          echo "Failed to extract target host from mock-devices.txt"
          exit 1
        fi

        echo "host=$target_host" >> "$GITHUB_OUTPUT"

    - name: Simulate out-of-band NETCONF drift
      run: |
        set -euo pipefail
        python .github/scripts/apply_netconf_drift.py \
          --devices-file ci-evpn-vxlan-tf/mock-devices.txt \
          --target-host '${{ steps.state_baseline.outputs.host }}' \
          --drift-ip 203.0.113.250/32 \
          --username ci-user \
          --password ci-password \
          --connect-host 127.0.0.1

    - name: Terraform plan should detect out-of-band drift
      id: drift_plan
      continue-on-error: true
      working-directory: ci-evpn-vxlan-tf
      run: terraform plan -no-color -input=false -detailed-exitcode -out=tfplan-drift

    - name: Assert drift detection exit code
      run: |
        if [ "${{ steps.drift_plan.outputs.exitcode }}" != "2" ]; then
          echo "Expected drift plan exit code 2 after out-of-band change, got ${{ steps.drift_plan.outputs.exitcode }}"
          exit 1
        fi

    - name: Terraform reconcile out-of-band drift
      working-directory: ci-evpn-vxlan-tf
      run: terraform apply -no-color -input=false -auto-approve -parallelism="$TF_APPLY_PARALLELISM" tfplan-drift

    - name: Terraform no-op plan after drift reconcile
      id: drift_plan_final
      continue-on-error: true
      working-directory: ci-evpn-vxlan-tf
      run: terraform plan -no-color -input=false -detailed-exitcode

    - name: Assert no-op after drift reconcile
      run: |
        if [ "${{ steps.drift_plan_final.outputs.exitcode }}" != "0" ]; then
          echo "Expected no-op plan after reconciling drift, got ${{ steps.drift_plan_final.outputs.exitcode }}"
          exit 1
        fi

    - name: Assert Terraform state remains managed
      working-directory: ci-evpn-vxlan-tf
      run: |
        set -euo pipefail
        after_serial="$(terraform state pull | python ../.github/scripts/tfstate_serial.py)"
        if [ "$after_serial" -lt "${{ steps.state_baseline.outputs.serial }}" ]; then
          echo "Expected state serial to not decrease after drift reconcile (before=${{ steps.state_baseline.outputs.serial }}, after=$after_serial)"
          exit 1
        fi
        terraform state show "${{ steps.state_baseline.outputs.resource }}" >/dev/null

    - name: Prepare negative test inputs
      run: |
        set -euo pipefail
        rm -rf ci-evpn-vxlan-tf-negative
        cp -R ci-evpn-vxlan-tf ci-evpn-vxlan-tf-negative
        pushd ci-evpn-vxlan-tf-negative
        python ../.github/scripts/mutate_first_ipv4_cidr.py \
          --directory . \
          --replacement 203.0.113.20/32 \
          --exclude providers.tf
        sed -E -i 's/password[[:space:]]*=[[:space:]]*"[^"]*"/password = "wrong-password"/g' providers.tf
        popd

    - name: Terraform negative apply with bad credentials
      id: negative_apply
      working-directory: ci-evpn-vxlan-tf-negative
      run: |
        set +e
        terraform apply -refresh=false -no-color -input=false -auto-approve -parallelism="$TF_APPLY_PARALLELISM" > negative_apply.log 2>&1
        rc=$?
        set -e
        echo "exitcode=$rc" >> "$GITHUB_OUTPUT"

    - name: Assert negative apply failed
      run: |
        if [ "${{ steps.negative_apply.outputs.exitcode }}" = "0" ]; then
          echo "Expected apply to fail with wrong credentials, but it succeeded"
          cat ci-evpn-vxlan-tf-negative/negative_apply.log
          exit 1
        fi

    - name: NETCONF failure diagnostics
      if: failure()
      run: |
        set +e
        echo "==== NETCONF mock diagnostics ===="
        if [ -f .netconf_mock.pid ]; then
          MOCK_PID="$(cat .netconf_mock.pid)"
          echo "Mock PID: $MOCK_PID"
          if kill -0 "$MOCK_PID" 2>/dev/null; then
            echo "Mock process is still running"
          else
            echo "Mock process is not running"
          fi
        else
          echo "No mock PID file found"
        fi

        echo "-- listener snapshot --"
        if command -v ss >/dev/null 2>&1; then
          ss -ltn | grep -E '127\.0\.0\.1:(830[0-9]|83[1-9][0-9])' || true
        elif command -v netstat >/dev/null 2>&1; then
          netstat -ltn | grep -E '127\.0\.0\.1:(830[0-9]|83[1-9][0-9])' || true
        else
          echo "Neither ss nor netstat is available in this runner"
        fi

        echo "-- netconf mock log tail --"
        tail -n 200 netconf-mock.log || true

        echo "-- netconf state dump head --"
        if [ -f netconf-mock-state.json ]; then
          head -n 120 netconf-mock-state.json || true
        else
          echo "netconf-mock-state.json not found"
        fi

    - name: Stop NETCONF mock
      if: always()
      run: |
        set +e
        if [ -f .netconf_mock.pid ]; then
          MOCK_PID="$(cat .netconf_mock.pid)"
          if kill -0 "$MOCK_PID" 2>/dev/null; then
            kill "$MOCK_PID"
          fi
        fi

    - name: Upload NETCONF integration logs
      if: always() && env.ACTIONS_RUNTIME_TOKEN != ''
      uses: actions/upload-artifact@v7
      with:
        name: netconf-integration-logs-${{ matrix.schema_scope }}
        path: |
          netconf-mock.log
          netconf-mock-state.json
          ci-evpn-vxlan-tf-negative/negative_apply.log

  groups-lifecycle:
    name: Terraform integration (configuration groups)
    runs-on: ubuntu-latest
    env:
      TF_APPLY_PARALLELISM: 3
      PROVIDER: junos-vqfx-evpn-vxlan-groups

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python (latest)
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Install Python dependencies for tooling
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -m pip install .
        python -m pip install asyncssh

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 'stable'

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        # The wrapper swallows the exit code, and these steps read it to tell a
        # plan with changes from one without.
        terraform_wrapper: false

    - name: Build a provider that manages groups
      run: |
        set -euo pipefail
        cd examples/providers
        JTAF_PROVIDER_OUTPUT_DIR="$GITHUB_WORKSPACE/groups-provider" \
        JTAF_SKIP_PROVIDER_INSTALL=1 \
          bash build-groups.sh

    - name: Assert the embedded schema carries groups
      run: |
        python - <<'PY'
        import gzip, json, os, sys, pathlib
        path = (pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "groups-provider"
                / f"terraform-provider-{os.environ['PROVIDER']}" / "trimmed_schema.json.gz")
        schema = json.load(gzip.open(path))
        config = next(c for c in schema["root"]["children"] if c["name"] == "configuration")
        names = [c["name"] for c in config["children"]]
        missing = [n for n in ("groups", "apply-groups") if n not in names]
        if missing:
            sys.exit(f"schema is missing {missing}; top level is {names}")
        groups = next(c for c in config["children"] if c["name"] == "groups")
        if groups.get("key") != "name":
            sys.exit("groups should be keyed by name")
        print("schema carries groups and apply-groups")
        PY

    - name: Convert the group-based example
      run: |
        set -euo pipefail
        cd examples/providers
        JTAF_PROVIDER_OUTPUT_DIR="$GITHUB_WORKSPACE/groups-provider" \
        JTAF_TERRAFORM_OUTPUT_DIR="$GITHUB_WORKSPACE/groups-tf" \
          bash convert-groups.sh

    - name: Prepare Terraform and the NETCONF mock
      run: |
        set -euo pipefail

        pushd "groups-provider/terraform-provider-$PROVIDER"
        go install .
        popd

        cat > "$HOME/.terraformrc" <<EOF
        provider_installation {
          dev_overrides {
            "hashicorp/$PROVIDER" = "$HOME/go/bin"
          }
          direct {}
        }
        EOF
        echo "TF_CLI_CONFIG_FILE=$HOME/.terraformrc" >> "$GITHUB_ENV"
        echo "TF_IN_AUTOMATION=1" >> "$GITHUB_ENV"

        python .github/scripts/rewrite_mock_providers.py \
          --providers-file groups-tf/providers.tf \
          --devices-file groups-tf/mock-devices.txt \
          --bind-host 127.0.0.1 \
          --base-port 8401 \
          --provider-name "$PROVIDER"

        nohup python netconf_mock/netconf_mock_server.py \
          --host 127.0.0.1 \
          --username jcluser \
          --password 'Juniper!1' \
          --log-level DEBUG \
          --devices-file groups-tf/mock-devices.txt \
          --state-dump netconf-mock-state.json \
          > netconf-mock.log 2>&1 < /dev/null &
        echo "$!" > .netconf_mock.pid

        for _ in $(seq 1 30); do
          ready=1
          while IFS=: read -r _name port; do
            [ -z "${port}" ] && continue
            (echo > /dev/tcp/127.0.0.1/"${port}") >/dev/null 2>&1 || ready=0
          done < groups-tf/mock-devices.txt
          [ "$ready" -eq 1 ] && break
          sleep 1
        done
        if [ "$ready" -ne 1 ]; then
          echo "NETCONF mock listeners were not ready in time"
          cat netconf-mock.log || true
          exit 1
        fi

    - name: Terraform validate
      working-directory: groups-tf
      run: terraform validate -no-color

    - name: Terraform apply
      working-directory: groups-tf
      run: |
        set -euo pipefail
        terraform apply -no-color -input=false -auto-approve \
          -parallelism="$TF_APPLY_PARALLELISM"

    - name: Assert the applied configuration is idempotent
      working-directory: groups-tf
      run: |
        set +e
        terraform plan -refresh=false -no-color -input=false -detailed-exitcode
        code=$?
        set -e
        [ "$code" -eq 0 ] || { echo "expected no changes, got exit $code"; exit 1; }

    - name: Assert the device holds the group, not a flattened copy
      run: |
        set -euo pipefail
        python .github/scripts/fetch_netconf_config.py \
          --devices-file groups-tf/mock-devices.txt \
          --target-host dc1-spine1 \
          --username jcluser \
          --password 'Juniper!1' \
          --output dc1-spine1.xml

        python - <<'PY'
        import xml.etree.ElementTree as ET
        config = ET.parse("dc1-spine1.xml").getroot()
        groups = [g.findtext("name") for g in config.findall("groups")]
        assert groups == ["spine"], f"expected one group named spine, got {groups}"
        assert config.findtext("system/host-name") == "dc1-spine1", "base host-name missing"
        assert config.findtext("apply-groups") == "spine", "group reference missing"
        print("device holds the group, the reference and its own host name")
        PY

    - name: Simulate drift inside a group
      run: |
        set -euo pipefail
        python .github/scripts/apply_netconf_drift.py \
          --devices-file groups-tf/mock-devices.txt \
          --target-host dc1-spine1 \
          --target-group spine \
          --drift-ip 203.0.113.250/32 \
          --username jcluser \
          --password 'Juniper!1' \
          --connect-host 127.0.0.1

    - name: Assert drift inside a group is detected and reconciled
      working-directory: groups-tf
      run: |
        set +e
        terraform plan -no-color -input=false -detailed-exitcode -out=tfplan-drift
        code=$?
        set -e
        [ "$code" -eq 2 ] || { echo "expected drift, got exit $code"; exit 1; }

        terraform apply -no-color -input=false -auto-approve \
          -parallelism="$TF_APPLY_PARALLELISM" tfplan-drift

        set +e
        terraform plan -no-color -input=false -detailed-exitcode
        code=$?
        set -e
        [ "$code" -eq 0 ] || { echo "drift not reconciled, got exit $code"; exit 1; }

    - name: Assert removing a group leaves the rest of the device alone
      run: |
        set -euo pipefail
        python - <<'PY'
        import pathlib, re
        p = pathlib.Path("groups-tf/dc1-leaf3.tf")
        s = p.read_text()
        s = re.sub(r"\n  apply_groups = [^\n]*\n", "\n", s)
        start = s.index("  groups = [")
        depth, i = 0, start
        while True:
            if s[i] == "[":
                depth += 1
            elif s[i] == "]":
                depth -= 1
                if depth == 0:
                    i += 1
                    break
            i += 1
        p.write_text(s[:start] + s[i:].lstrip("\n"))
        PY

        cd groups-tf
        terraform apply -no-color -input=false -auto-approve \
          -parallelism="$TF_APPLY_PARALLELISM"
        cd ..

        for device in dc1-leaf3 dc1-leaf1; do
          python .github/scripts/fetch_netconf_config.py \
            --devices-file groups-tf/mock-devices.txt \
            --target-host "$device" \
            --username jcluser \
            --password 'Juniper!1' \
            --output "$device.xml"
        done

        python - <<'PY'
        import xml.etree.ElementTree as ET
        leaf3 = ET.parse("dc1-leaf3.xml").getroot()
        assert leaf3.findall("groups") == [], "the group should be gone"
        assert leaf3.findtext("system/host-name") == "dc1-leaf3", "base hierarchy was damaged"
        leaf1 = ET.parse("dc1-leaf1.xml").getroot()
        assert [g.findtext("name") for g in leaf1.findall("groups")] == ["leaf"], \
            "another device's group was touched"
        print("group removed from one device, every other device untouched")
        PY

    - name: Stop NETCONF mock
      if: always()
      run: |
        set +e
        if [ -f .netconf_mock.pid ]; then
          MOCK_PID="$(cat .netconf_mock.pid)"
          if kill -0 "$MOCK_PID" 2>/dev/null; then
            kill "$MOCK_PID"
          fi
        fi

    - name: Upload NETCONF integration logs
      if: always() && env.ACTIONS_RUNTIME_TOKEN != ''
      uses: actions/upload-artifact@v7
      with:
        name: netconf-integration-logs-groups
        path: |
          netconf-mock.log
          netconf-mock-state.json
